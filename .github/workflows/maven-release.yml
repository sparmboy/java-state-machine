name: Maven Release
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The branch to checkout when cutting the release."
        required: true
        default: "main"
      releaseVersion:
        description: "Default version to use when preparing a release."
        required: true
        default: "X.Y.Z"
      developmentVersion:
        description: "Default version to use for new local working copy."
        required: true
        default: "X.Y.Z-SNAPSHOT"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      # Released artifacts are built with the oldest JDK the library supports.
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: maven

      - name: Configure Git User
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Cut release
        run: mvn release:prepare release:perform -B -s .maven_settings.xml -DreleaseVersion="$RELEASE_VERSION" -DdevelopmentVersion="$DEVELOPMENT_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
          DEVELOPMENT_VERSION: ${{ inputs.developmentVersion }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
